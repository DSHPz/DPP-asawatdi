<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax</title>
    <link rel="stylesheet" href="parallax.css" />
  </head>
  <body>
    <section class="parallax first">
      <p>Scroll down, the journey has just begun.</p>
    </section>

    <section class="black-block">
      <div>
        <h2>Between two worlds</h2>
        <p>
          While the page moves, the picture stays in place. That small
          difference in speed is what gives the illusion of depth.
        </p>
      </div>
    </section>

    <section class="parallax second">
      <p>You made it to the end. Welcome to the sunrise.</p>
    </section>
  </body>
</html>
