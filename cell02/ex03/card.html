<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>User Profile Card</h1>
    </header>

    <div class="card">
      <!-- Invisible table (no borders) used only to align the information -->
      <table>
        <!-- Profile picture -->
        <tr>
          <td class="picture" colspan="4">
            <img
              alt="Profile picture"
              src="https://thispersondoesnotexist.com/random-person.jpeg"
            />
          </td>
        </tr>

        <!-- Login, under the picture -->
        <tr>
          <td class="login" colspan="4">
            <h2>jdoe42</h2>
          </td>
        </tr>

        <!-- 2-3 word description -->
        <tr>
          <td class="description" colspan="4">Curious web student</td>
        </tr>

        <!-- Small social network images, lined up -->
        <tr class="social">
          <td class="social">
            <a href="#" title="Dribbble"
              ><img
                alt="Dribbble"
                src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23000' stroke-width='2.5'/><path d='M6 11C13 14 21 14 27 9M5 18C12 15 22 17 26 25M12 4C17 11 19 20 18 28' fill='none' stroke='%23000' stroke-width='2.5'/></svg>"
            /></a>
          </td>
          <td class="social">
            <a href="#" title="Twitter"
              ><img
                alt="Twitter"
                src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M29 8c-1 .5-2 .8-3 .9 1-.7 2-1.700 2.300-3-1 .6-2.100 1-3.300 1.300A5.300 5.300 0 0 0 16 12.100 15 15 0 0 1 5 6.500a5.300 5.300 0 0 0 1.600 7c-.9 0-1.700-.3-2.400-.7 0 2.600 1.800 4.800 4.200 5.300-.8.200-1.600.3-2.400.1.700 2.100 2.600 3.600 4.900 3.700A10.700 10.700 0 0 1 3 24c2.400 1.500 5.200 2.400 8.100 2.400 9.700 0 15-8.100 15-15v-.7c1-.7 1.900-1.600 2.600-2.700Z' fill='%23000'/></svg>"
            /></a>
          </td>
          <td class="social">
            <a href="#" title="LinkedIn"
              ><img
                alt="LinkedIn"
                src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='12' width='5' height='15' fill='%23000'/><circle cx='6.500' cy='6.500' r='3' fill='%23000'/><path d='M13 12h5v2.200c1-1.600 2.700-2.600 5-2.600 4.300 0 5.500 2.800 5.500 6.600V27h-5v-8c0-2-.5-3.300-2.300-3.300S18 17 18 19v8h-5Z' fill='%23000'/></svg>"
            /></a>
          </td>
          <td class="social">
            <a href="#" title="Facebook"
              ><img
                alt="Facebook"
                src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M18.500 29V18h4l.7-4.500h-4.700v-2.700c0-1.300.6-2.400 2.500-2.400h2.300V4.600S21.600 4.200 19.900 4.200c-3.600 0-5.900 2.200-5.900 6.100v3.200H10V18h4v11Z' fill='%23000'/></svg>"
            /></a>
          </td>
        </tr>

        <!-- Clickable button -->
        <tr>
          <td colspan="4">
            <a class="contact" href="mailto:jdoe42@example.com">Contact</a>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
