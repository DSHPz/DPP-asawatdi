<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="calc.css" />
  </head>
  <body>
    <a class="home-link" href="../main.html">← Back to exercises</a>
    <main>
      <h1>Calculator</h1>
      <form id="calc-form">
        <label class="visually-hidden" for="left">First number</label>
        <input type="text" id="left" name="left" inputmode="numeric" autocomplete="off" />
        <label class="visually-hidden" for="operator">Operation</label>
        <select id="operator" name="operator">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">*</option>
          <option value="/">/</option>
          <option value="%">%</option>
        </select>
        <label class="visually-hidden" for="right">Second number</label>
        <input type="text" id="right" name="right" inputmode="numeric" autocomplete="off" />
        <input type="submit" value="Try me!" />
      </form>
    </main>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="calc.js"></script>
  </body>
</html>
