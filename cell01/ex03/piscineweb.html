<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piscine Web</title>
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        box-sizing: border-box;
      }
      h1 {
        font-size: 3rem;
        text-align: center;
        margin-bottom: 30px;
        color: #333;
      }
      .image-container {
        display: flex;
        flex-direction: row; /* จัดเรียงแนวนอน */
        justify-content: center;
        align-items: center;
        gap: 20px;
        width: 100%;
        max-width: 1000px;
      }
      /* ปรับแต่งให้ลิงก์ครอบคลุมขนาดของรูปและแสดงเอฟเฟกต์ hover ได้ถูกต้อง */
      .image-container a {
        flex: 1;
        display: flex;
        max-width: 480px;
      }
      .image-container img {
        width: 100%;
        height: 320px;
        object-fit: cover;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease;
      }
      .image-container a:hover img {
        transform: translateY(-5px);
      }
      .image-container > img {
        flex: 1;
        max-width: 480px;
      }
      .image-container > img:hover {
        transform: translateY(-5px);
      }
    </style>
  </head>
  <body>
    <h1>Piscine Web</h1>
    <div class="image-container">
      <a
        href="https://www.youtube.com/watch?v=INscMGmhmX4"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="https://images.pexels.com/photos/20816519/pexels-photo-20816519.jpeg?auto=compress&cs=tinysrgb&w=1260"
          alt="Dog lying down and cat sitting"
        />
      </a>
      <img
        src="https://content.pexels.com/aigc-bundle/images/59542160-079d-4ce0-9af7-a134f940e7ea.jpg"
        alt="Pexels AIGC image"
      />
    </div>
  </body>
</html>
