<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two Cells Table</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f9f9f9;
      }
      table {
        width: 80%;
        max-width: 900px;
        border-collapse: collapse;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      td {
        padding: 50px 30px;
        font-size: 1.5rem;
        color: #222;
        border: 1px solid #333;
      }
      /* กำหนดสีและขนาดความกว้างของช่องแรก */
      .first-cell {
        background-color: #b8c47b; /* สีเขียวมะกอก */
        width: 50%;
      }
      /* กำหนดสีและขนาดความกว้างของช่องที่สอง */
      .second-cell {
        background-color: #f4b19b; /* สีส้มพีช/แซลมอน */
        width: 50%;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td class="first-cell">First cell</td>
        <td class="second-cell">Second cell</td>
      </tr>
    </table>
  </body>
</html>
