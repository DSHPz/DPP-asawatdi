<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Cells Table</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      table {
        width: 100vw;
        height: 100vh;
        table-layout: fixed; /* equal columns, table never grows past the page */
        border-collapse: collapse;
      }

      td {
        padding: 0;
        text-align: center;
        vertical-align: middle;
        overflow: hidden;
        word-break: break-word;
        font-size: clamp(
          0.6rem,
          3vw,
          1.75rem
        ); /* text shrinks with the window */
        font-weight: 600;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
        border: 2px solid rgba(255, 255, 255, 0.6);
      }

      td:nth-child(1) {
        background-color: #ef476f;
      }
      td:nth-child(2) {
        background-color: #f78c6b;
      }
      td:nth-child(3) {
        background-color: #ffd166;
        color: #333;
        text-shadow: none;
      }
      td:nth-child(4) {
        background-color: #06d6a0;
      }
      td:nth-child(5) {
        background-color: #118ab2;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td class="cell 1">cell 1</td>
        <td class="cell 2">cell 2</td>
        <td class="cell 3">cell 3</td>
        <td class="cell 4">cell 4</td>
        <td class="cell 5">cell 5</td>
      </tr>
    </table>
  </body>
</html>
